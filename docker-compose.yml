name: nyayasetu

x-app-environment: &app-environment
  APP_NAME: nyayasetu
  APP_ENV: local
  LOG_LEVEL: INFO
  DATA_FILE: data/sample_records.json
  DATABASE_URL: postgresql://app:app@db:5432/app # pragma: allowlist secret
  REDIS_URL: redis://redis:6379

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app # pragma: allowlist secret
      POSTGRES_DB: app
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build: .
    command:
      - sh
      - -c
      - alembic upgrade head && python scripts/load_db.py
    environment: *app-environment
    depends_on:
      db:
        condition: service_healthy

  api:
    build: .
    environment: *app-environment
    env_file: &keys
      - path: .env
        required: false
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  worker:
    build: .
    command: ["arq", "nyayasetu.workers.main.WorkerSettings"]
    environment: *app-environment
    env_file: *keys
    volumes:
      - ./data/raw:/app/data/raw:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
