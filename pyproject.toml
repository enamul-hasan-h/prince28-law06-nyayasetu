[project]
name = "nyayasetu"
version = "0.1.0"
description = "NyayaSetu is a digital platform designed to make legal information, assistance, and access to justice simpler and more accessible for everyone."
readme = "README.md"
authors = [
    { name = "Enamul Hasan H", email = "hasanenamul.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
