[project]
name = "nyayasetu"
version = "0.1.0"
description = "NyayaSetu is a digital platform designed to make legal information, assistance, and access to justice simpler and more accessible for everyone."
readme = "README.md"
authors = [
    { name = "Enamul Hasan H", email = "hasanenamul.h@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "fastapi>=0.163.1",
    "pydantic-settings>=2.16.3",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "poethepoet>=0.49.0",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]


[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"
markers = [
    "unit: tests that do not require external services",
    "integration: tests that require PostgreSQL",
]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]

[tool.coverage.run]
source = ["nyayasetu"]
branch = true
omit = [
    "*/__init__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 70

[tool.poe.tasks]
test = "pytest"
test-unit = "pytest -m unit"
test-integration = "python scripts/run_integration_tests.py"
coverage = "pytest --cov=nyayasetu --cov-report=term-missing"
lint = "ruff check ."
format = "ruff format ."
check = ["lint", "test"]
